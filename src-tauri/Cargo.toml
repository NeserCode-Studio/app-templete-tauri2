[package]
name = "tauri-app"
version = "0.1.0"
description = "A Tauri App"
authors = ["nesercode"]
edition = "2021"

[lib]
name = "tauri_app_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.10", features = ["tray-icon", "image-png", "devtools"] }
tauri-plugin-opener = "2.5"
tauri-plugin-shell = "2.3"
tauri-plugin-http = "2.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
